<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administración de usuarios | Nexo Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/css/app-layout.css" />
    <link rel="stylesheet" href="../assets/css/useradmin.css" />
  </head>
  <body>
    <header>
      <iframe
        class="navbar-frame"
        id="navbar-frame"
        src="../components/navbar.html"
        title="Barra de navegación"
      ></iframe>
    </header>
    <div class="container-fluid px-0">
      <div class="row g-0">
        <aside class="col-12 col-lg-auto sidebar-panel" id="sidebar-panel">
          <iframe
            class="sidebar-frame"
            src="../components/sidebar.html"
            title="Menú lateral"
          ></iframe>
        </aside>
        <main class="col-12 col-lg p-4 p-xl-5" id="useradmin-content">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
              <h1 class="h2 mb-1">Administración de usuarios</h1>
              <p class="text-secondary mb-0">Consulta y administra las cuentas del sistema.</p>
            </div>
            <div class="accordion" id="newUserAccordionContainer">
              <div class="accordion-item">
                <h2 class="accordion-header" id="newUserAccordionHeader">
                  <button class="accordion-button collapsed d-flex align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#newUserAccordion" aria-expanded="false" aria-controls="newUserAccordion">
                    Crear nuevo usuario
                    <span class="ms-auto">&#9654;</span>
                  </button>
                </h2>
                <div id="newUserAccordion" class="accordion-collapse collapse" aria-labelledby="newUserAccordionHeader" data-bs-parent="#newUserAccordionContainer">
                  <div class="accordion-body p-0">
                    <iframe class="user-form-frame" src="../components/usernew.html" title="Formulario de registro de usuario"></iframe>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <section class="card border-0 shadow-sm" aria-label="Lista de usuarios">
            <iframe
              class="users-list-frame"
              src="../components/userlist.html"
              title="Tabla de usuarios"
            ></iframe>
          </section>
        </main>
      </div>
    </div>

    <div
      class="modal fade"
      id="userRegistrationModal"
      tabindex="-1"
      aria-labelledby="userRegistrationModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable user-modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="userRegistrationModalLabel">Registrar usuario</h2>
            <button
              class="btn-close"
              type="button"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body p-0">
            <iframe
              class="user-form-frame"
              src="../components/usernew.html"
              title="Formulario de registro de usuario"
            ></iframe>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/sidebar-toggle.js"></script>
  </body>
</html>
