<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lista de usuarios</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/userlist.css" />
  </head>
  <body>
    <main class="user-list-page">
      <div class="table-responsive">
        <table class="table table-hover align-middle user-table mb-0">
          <caption class="caption-top text-secondary">Usuarios de ejemplo</caption>
          <thead class="table-light">
            <tr>
              <th scope="col">Id</th>
              <th scope="col">Nombre</th>
              <th scope="col">Apellido</th>
              <th scope="col">Email</th>
              <th scope="col">Rol</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>U-001</td>
              <td>Ana</td>
              <td>Torres</td>
              <td>ana.torres@example.com</td>
              <td>Administrador</td>
              <td>
                <div class="user-actions">
                  <button class="btn btn-sm btn-outline-primary user-action-button" type="button"><i class="bi bi-pencil-square" aria-hidden="true"></i><span>Editar</span></button>
                  <button class="btn btn-sm btn-outline-danger user-action-button" type="button"><i class="bi bi-trash" aria-hidden="true"></i><span>Eliminar</span></button>
                  <button class="btn btn-sm btn-outline-secondary user-action-button" type="button"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Detalles</span></button>
                  <button class="btn btn-sm btn-outline-warning user-action-button" type="button" aria-label="Desactivar a Ana Torres"><i class="bi bi-toggle-on" aria-hidden="true"></i><span>Desactivar</span></button>
                </div>
              </td>
            </tr>
            <tr>
              <td>U-002</td>
              <td>Marco</td>
              <td>Ruiz</td>
              <td>marco.ruiz@example.com</td>
              <td>Editor</td>
              <td>
                <div class="user-actions">
                  <button class="btn btn-sm btn-outline-primary user-action-button" type="button"><i class="bi bi-pencil-square" aria-hidden="true"></i><span>Editar</span></button>
                  <button class="btn btn-sm btn-outline-danger user-action-button" type="button"><i class="bi bi-trash" aria-hidden="true"></i><span>Eliminar</span></button>
                  <button class="btn btn-sm btn-outline-secondary user-action-button" type="button"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Detalles</span></button>
                  <button class="btn btn-sm btn-outline-warning user-action-button" type="button" aria-label="Desactivar a Marco Ruiz"><i class="bi bi-toggle-on" aria-hidden="true"></i><span>Desactivar</span></button>
                </div>
              </td>
            </tr>
            <tr>
              <td>U-003</td>
              <td>Lucía</td>
              <td>Chen</td>
              <td>lucia.chen@example.com</td>
              <td>Inventario</td>
              <td>
                <div class="user-actions">
                  <button class="btn btn-sm btn-outline-primary user-action-button" type="button"><i class="bi bi-pencil-square" aria-hidden="true"></i><span>Editar</span></button>
                  <button class="btn btn-sm btn-outline-danger user-action-button" type="button"><i class="bi bi-trash" aria-hidden="true"></i><span>Eliminar</span></button>
                  <button class="btn btn-sm btn-outline-secondary user-action-button" type="button"><i class="bi bi-info-circle" aria-hidden="true"></i><span>Detalles</span></button>
                  <button class="btn btn-sm btn-outline-success user-action-button" type="button" aria-label="Activar a Lucía Chen"><i class="bi bi-toggle-off" aria-hidden="true"></i><span>Activar</span></button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
