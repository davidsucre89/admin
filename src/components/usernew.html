<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registrar usuario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../assets/css/usernew.css" />
  </head>
  <body>
    <main class="user-new-page p-3 p-md-4">
      <form id="userRegistrationForm">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="firstName">Nombre</label>
            <input class="form-control" id="firstName" name="firstName" autocomplete="given-name" required />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="lastName">Apellido</label>
            <input class="form-control" id="lastName" name="lastName" autocomplete="family-name" required />
          </div>
          <div class="col-12">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="col-12">
            <label class="form-label" for="role">Rol</label>
            <select class="form-select" id="role" name="role" required>
              <option value="" selected disabled>Selecciona un rol</option>
              <option value="admin">Administrador</option>
              <option value="editor">Editor</option>
              <option value="inventory">Inventario</option>
              <option value="viewer">Consulta</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="password">Contraseña temporal</label>
            <input
              class="form-control"
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
            <div class="form-text">Debe tener al menos 8 caracteres.</div>
          </div>
        </div>
        <div class="d-flex justify-content-end gap-2 mt-4">
          <button class="btn btn-outline-secondary" type="reset">Limpiar</button>
          <button class="btn btn-primary" type="submit">Registrar usuario</button>
        </div>
        <p class="alert alert-info mt-3 mb-0" id="formStatus" role="status" hidden>
          Formulario de ejemplo validado; no se guardó ningún usuario porque aún no hay un servicio conectado.
        </p>
      </form>
    </main>
    <script>
      document.getElementById("userRegistrationForm").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("formStatus").hidden = false;
      });
    </script>
  </body>
</html>
